
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080516">
<title>Galaxy Heart 💖</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Pacifico&display=swap');

:root {
  --pink: #ff69bd;
  --purple: #bb86fc;
  --blue: #78ddff;
  --bg: #080516;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(ellipse at 50% 45%,
      #25104c 0%, #100a29 35%, #080516 72%);
  color: white;
  font-family: 'Quicksand', sans-serif;
}

#stars, #particles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

#stars {
  z-index: 0;
}

#particles {
  z-index: 5;
}

.nebula {
  position: fixed;
  width: 80vw;
  height: 80vw;
  max-width: 650px;
  max-height: 650px;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(165, 70, 255, .20),
    rgba(58, 112, 255, .10) 40%,
    transparent 70%
  );
  filter: blur(15px);
  pointer-events: none;
  z-index: 0;
}

.scene {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  padding: 25px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.subtitle {
  color: #d8baff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 15px;
  animation: subtitleGlow 3s ease-in-out infinite alternate;
}

.heart-container {
  position: relative;
  width: 270px;
  height: 250px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.heart-glow {
  position: absolute;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: #ec35ad;
  filter: blur(65px);
  opacity: .65;
  animation: glowPulse 2s ease-in-out infinite alternate;
}

.heart {
  position: relative;
  z-index: 2;
  font-family: Arial, sans-serif;
  font-size: 170px;
  line-height: 1;
  background: linear-gradient(
    135deg,
    #ffe1f4 0%,
    #ff71c6 25%,
    #ff318b 48%,
    #bc62ff 75%,
    #79dfff 100%
  );
  background-size: 200% 200%;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter:
    drop-shadow(0 0 8px rgba(255, 80, 180, .9))
    drop-shadow(0 0 25px rgba(184, 75, 255, .8));
  animation: heartbeat 1.5s ease-in-out infinite,
             heartColor 5s ease infinite;
  user-select: none;
}

.orbit {
  position: absolute;
  width: 245px;
  height: 95px;
  border: 1px solid rgba(216, 186, 255, .65);
  border-radius: 50%;
  pointer-events: none;
}

.orbit-one {
  transform: rotate(-25deg);
  animation: orbitOne 9s linear infinite;
}

.orbit-two {
  width: 220px;
  height: 115px;
  border-color: rgba(120, 221, 255, .5);
  transform: rotate(55deg);
  animation: orbitTwo 12s linear infinite;
}

.spark {
  position: absolute;
  z-index: 3;
  color: #fff0b5;
  font-size: 25px;
  text-shadow: 0 0 15px #ff80d5;
  animation: twinkle 1.5s ease-in-out infinite alternate;
}

.spark-one {
  top: 22px;
  right: 28px;
}

.spark-two {
  bottom: 28px;
  left: 15px;
  animation-delay: .5s;
}

.spark-three {
  top: 50px;
  left: 20px;
  animation-delay: .9s;
}

.name {
  max-width: 100%;
  overflow-wrap: anywhere;
  font-family: 'Pacifico', cursive;
  font-size: clamp(34px, 9vw, 65px);
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: 1px;
  background: linear-gradient(
    90deg,
    #ff9de2,
    #c4a1ff,
    #83eaff,
    #fff0b5,
    #ff9de2
  );
  background-size: 300% auto;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 13px rgba(198, 112, 255, .4));
  animation: rainbow 5s linear infinite;
}

.message {
  margin-top: 8px;
  color: #e3d7ff;
  font-size: 14px;
  letter-spacing: 1px;
}

button {
  margin-top: 25px;
  padding: 13px 23px;
  border: 1px solid rgba(255, 177, 235, .8);
  border-radius: 50px;
  background: rgba(133, 75, 200, .2);
  color: #ffe1f6;
  font: 700 13px 'Quicksand', sans-serif;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(200, 90, 255, .2);
  transition: transform .25s, box-shadow .25s;
}

button:hover {
  transform: scale(1.06);
  box-shadow: 0 0 30px rgba(200, 90, 255, .65);
}

button:active {
  transform: scale(.96);
}

.hint {
  margin-top: 18px;
  color: #a99acb;
  font-size: 11px;
  letter-spacing: 1px;
}

.star {
  position: absolute;
  display: block;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px #c5b5ff;
  animation: starPulse 2s ease-in-out infinite alternate;
}

.particle {
  position: fixed;
  z-index: 6;
  pointer-events: none;
  animation: floatUp 2.5s ease-out forwards;
  filter: drop-shadow(0 0 8px currentColor);
  user-select: none;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.12); }
  30% { transform: scale(1); }
  45% { transform: scale(1.07); }
}

@keyframes glowPulse {
  from { opacity: .35; transform: scale(.85); }
  to { opacity: .75; transform: scale(1.2); }
}

@keyframes orbitOne {
  from { transform: rotate(-25deg); }
  to { transform: rotate(335deg); }
}

@keyframes orbitTwo {
  from { transform: rotate(55deg); }
  to { transform: rotate(415deg); }
}

@keyframes twinkle {
  from { opacity: .3; scale: .7; }
  to { opacity: 1; scale: 1.3; }
}

@keyframes rainbow {
  to { background-position: 300% center; }
}

@keyframes heartColor {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes subtitleGlow {
  from { opacity: .55; }
  to { opacity: 1; }
}

@keyframes starPulse {
  from { opacity: .25; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.3); }
}

@keyframes floatUp {
  0% {
    transform: translate(-50%, 0) scale(.5) rotate(0);
    opacity: 0;
  }
  20% { opacity: 1; }
  100% {
    transform: translate(
      calc(-50% + var(--drift)),
      -75vh
    ) scale(1.4) rotate(45deg);
    opacity: 0;
  }
}

@media (max-width: 480px) {
  .scene {
    padding: 18px 12px;
  }

  .subtitle {
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }

  .heart-container {
    transform: scale(.84);
    margin-top: -10px;
    margin-bottom: -10px;
  }

  .message {
    font-size: 12px;
  }

  button {
    margin-top: 22px;
  }
}

@media (max-height: 650px) {
  .scene {
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .heart-container {
    transform: scale(.72);
    margin-top: -25px;
    margin-bottom: -25px;
  }

  .subtitle {
    margin-bottom: 0;
  }

  button {
    margin-top: 15px;
  }

  .hint {
    margin-top: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 8s !important;
  }
}
</style>
</head>

<body>

<div class="nebula"></div>
<div id="stars"></div>
<div id="particles"></div>

<main class="scene">
  <p class="subtitle">✦ A LITTLE UNIVERSE FOR YOU ✦</p>

  <div class="heart-container">
    <div class="heart-glow"></div>
    <div class="heart">♥</div>

    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>

    <span class="spark spark-one">✦</span>
    <span class="spark spark-two">✧</span>
    <span class="spark spark-three">✦</span>
  </div>

  <h1 class="name" id="name">មេីលម៉ែហែងអី</h1>

  <p class="message">You are my favorite star ✨</p>

  <button id="magicButton" type="button">
    ✧ Touch the Galaxy ✧
  </button>

  <p class="hint">Touch anywhere to create magic ♡</p>
</main>

<script>
"use strict";

// ==============================
// PERSONALIZE YOUR WEBSITE HERE
// ==============================

const SETTINGS = {
  name: "មេីលម៉ែហែងអី?",
  message: "You are my favorite star ✨",
  starCount: 130
};

const colors = [
  "#ff80c8",
  "#c4a1ff",
  "#83eaff",
  "#fff0a6",
  "#ffb3e6"
];

const stars = document.getElementById("stars");
const particles = document.getElementById("particles");
const button = document.getElementById("magicButton");
const nameElement = document.getElementById("name");
const messageElement = document.querySelector(".message");

nameElement.textContent = SETTINGS.name;
messageElement.textContent = SETTINGS.message;

// Generate background stars
for (let i = 0; i < SETTINGS.starCount; i++) {
  const star = document.createElement("span");
  star.className = "star";

  const size = Math.random() * 2.5 + 1;

  star.style.width = `${size}px`;
  star.style.height = `${size}px`;
  star.style.left = `${Math.random() * 100}%`;
  star.style.top = `${Math.random() * 100}%`;
  star.style.animationDelay = `${Math.random() * 3}s`;
  star.style.animationDuration = `${1 + Math.random() * 3}s`;

  stars.appendChild(star);
}

// Create floating hearts and sparkles
function createMagic(x, y, amount = 7) {
  const symbols = ["♥", "♡", "✦", "✧", "✨"];

  for (let i = 0; i < amount; i++) {
    const particle = document.createElement("span");
    particle.className = "particle";

    particle.textContent =
      symbols[Math.floor(Math.random() * symbols.length)];

    particle.style.left =
      `${x + (Math.random() - 0.5) * 100}px`;

    particle.style.top =
      `${y + (Math.random() - 0.5) * 40}px`;

    particle.style.color =
      colors[Math.floor(Math.random() * colors.length)];

    particle.style.fontSize =
      `${16 + Math.random() * 25}px`;

    particle.style.setProperty(
      "--drift",
      `${(Math.random() - 0.5) * 140}px`
    );

    particle.style.animationDelay =
      `${Math.random() * 0.3}s`;

    particles.appendChild(particle);

    particle.addEventListener("animationend", () => {
      particle.remove();
    });
  }
}

// Touch or click anywhere to create magic
document.addEventListener("pointerdown", (event) => {
  if (event.target.closest("#magicButton")) return;

  createMagic(event.clientX, event.clientY, 5);
});

// Button creates a larger magic burst
button.addEventListener("click", () => {
  const heart = document.querySelector(".heart-container");
  const rect = heart.getBoundingClientRect();

  createMagic(
    rect.left + rect.width / 2,
    rect.top + rect.height / 2,
    18
  );

  nameElement.animate(
    [
      { transform: "scale(1)" },
      { transform: "scale(1.12)" },
      { transform: "scale(1)" }
    ],
    {
      duration: 600,
      easing: "ease-in-out"
    }
  );
});

// Initial magic
window.addEventListener("load", () => {
  createMagic(
    window.innerWidth / 2,
    window.innerHeight / 2,
    12
  );
});
</script>

</body>
</html>
